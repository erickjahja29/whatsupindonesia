name: Perbarui data & terbitkan situs

on:
  schedule:
    - cron: "*/15 * * * *"   # tiap 15 menit (GitHub bisa menunda beberapa menit)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data live (gempa, titik panas, banjir, laporan warga, berita)
        run: python scripts/fetch_data.py
        env:
          # cache berita diambil dari situs yang sudah terbit, agar tidak mencari ulang tiap 15 menit
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
